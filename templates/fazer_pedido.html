<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviço</title>
    <!-- Favicon -->
	<link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico" />
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="/static/css/my_styles.css" rel="stylesheet" />
    <!-- JS-->
    <script src="/static/js/scripts.js" async></script>
</head>

<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="d-flex flex-column align-items-center">
            <h3 id="loadingTitle"></h3>
            <div id="loadingSpinner" class="spinner-border" role="status"></div>
            <button id="confirmButton" class="btn btn-primary mt-3" style="display: none;"
                onclick="hideLoading()">Continuar</button>
        </div>
    </div>

    <div class="container">
        <h1 class="text-center">Menu</h1>

        <!-- Menu Items -->
        {% for item in menu %}
        <div class="menu-item d-flex justify-content-between align-items-center">
            <span>{{ item }}</span>
            <button class="btn btn-success" onclick="addToOrder('{{ item }}', {{ menu[item] }})">Adicionar</button>
        </div>
        {% endfor %}

        <!-- Molhos -->
        <div class="menu-item">
            <h5>Extras:</h5>
            <div>
                <label class="sauce-label">
                    <input type="checkbox" id="ketchup" value="Ketchup"> Ketchup
                </label>
                <label class="sauce-label">
                    <input type="checkbox" id="maionese" value="Maionese"> Maionese
                </label>
                <label class="sauce-label">
                    <input type="checkbox" id="mostarda" value="Mostarda"> Mostarda
                </label>
            </div>
        </div>

        <div class="order-summary">
            <h2>Resumo do Pedido</h2>
            <ul id="orderList" class="list-unstyled"></ul>
            <p><strong>Total: €<span id="totalAmount">0.00</span></strong></p>

            <!-- Input para inserir o número da mesa -->
            <div class="mb-3">
                <input type="text" class="form-control" id="mesaInput" onfocus="this.classList.remove('is-invalid')" placeholder="Mesa">
            </div>

            <!-- Botões "Enviar Pedido" e "Cancelar Pedido" -->
            <div class="button-group">
                <button id="showReadyOrdersButton" class="btn btn-outline-warning show-ready-order" onclick="window.location.href='/prontos'">Prontos</button>
                <button id="sendOrderButton" class="btn btn-primary send-order" disabled
                    onclick="sendOrder()">Enviar</button>
                <button id="cancelOrderButton" class="btn btn-outline-danger" disabled onclick="resetOrder()">Cancelar</button>
            </div>
        </div>
    </div>

</body>

</html>
