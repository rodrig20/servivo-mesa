<!doctype html>
<html lang="pt-PT">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<meta name="description" content="" />
	<meta name="Caminehiros 625" content="" />
	<title>Login</title>
	<!-- Favicon -->
	<link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico" />
	<!-- CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.9.1/font/bootstrap-icons.min.css">
	<!-- JS-->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/static/js/scripts.js"></script>
</head>

<body>
	<!-- Login -->
	<section class="d-flex justify-content-center align-items-center min-vh-100 py-3 py-md-5">
		<div class="container container-login">
			<div class="row justify-content-center">
				<div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
					<div class="card border border-light-subtle rounded-3 shadow-sm">
						<div class="card-body p-3 p-md-4 p-xl-5">
							<div class="text-center mb-3">
								<img src="/static/assets/img/logo.png" alt="Scouts Logo" width="78">
							</div>

							<form id="loginForm">
								<div class="row gy-2 overflow-hidden">
									<div class="col-12">
										<div class="form-floating mb-3">
											<input type="text" class="form-control" name="username" id="username"
												placeholder="Utilizador" required pattern="^[^\s]{5,}$"
												onblur="uiIsValidUsername(this);"
												onfocus="this.classList.remove('is-invalid');"
												title="O nome de usuário deve ter pelo menos 5 caracteres e não pode conter espaços">
											<label for="username" class="form-label">Utilizador</label>
											<div class="invalid-feedback">
												Username inválido
											</div>
										</div>
									</div>
									<div class="col-12">
										<div class="form-floating mb-3">
											<input type="password" class="form-control" name="password" id="password"
												value="" placeholder="Password" required
												pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[^\s]{8,}$"
												onblur="uiIsValidPassword(this);"
												onfocus="this.classList.remove('is-invalid');"
												text="A senha deve ter pelo menos 8 caracteres, incluir pelo menos uma letra maiúscula, uma letra minúscula, um número e não conter espaços.">
											<label for="password" class="form-label">Password</label>
											<div class="invalid-feedback">
												Password inválida
											</div>
										</div>
									</div>
									<div class="text-danger d-none" id="formError">
										Username ou Password Inválida
									</div>
									<div class="col-12">
										<div class="d-grid my-3">
											<button class="btn btn-primary btn-lg" type="submit">Log in</button>
										</div>
									</div>
								</div>
							</form>

						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
