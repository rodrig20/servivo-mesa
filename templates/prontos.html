<!DOCTYPE html>
<html lang="pt" class="full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos Prontos</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico" />
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.9.1/font/bootstrap-icons.min.css">
    <link href="/static/css/my_styles.css" rel="stylesheet" />
    <!-- JS-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.1.3/socket.io.js" defer></script>
    <script src="/static/js/scripts.js" defer></script>
    <script>
        // Estrutura para armazenar os pedidos
        var pedidos = {}
        var first = true;
        var socket
        document.addEventListener('DOMContentLoaded', function () {
            socket = io();
            socket.on('update_prontos_{{name}}', (data) => {
                if (first) {
                    pedidos = data.data;
                }
                else {
                    if (data.data['mesa'] in pedidos) pedidos[data.data['mesa']].push(data.data['subpedido']);
                    else pedidos[data.data['mesa']] = [data.data['subpedido']];
                }
                first = false;
                renderizarPedidosProntos('{{name}}');
            });
            socket.emit('prontos_connect', '{{name}}');
        });
    </script>
</head>

<body class="full">
    <!-- Ícone de voltar no canto superior esquerdo -->
    <a href="/servico" class="back-button text-danger">
        <i class="bi bi-arrow-left" style="font-size: 2rem;"></i>
    </a>

    <div class="container-fluid full">
        <h1 class="text-center">Pedidos Prontos</h1>
        <div class="table-scroll">
            <table class="table table-bordered">
                <tbody id="pedidoTableBody">
                    <!-- Pedidos serão adicionados aqui -->
                </tbody>
            </table>
        </div>
    </div>

</body>

</html>
