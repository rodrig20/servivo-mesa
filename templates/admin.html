<!DOCTYPE html>
<html lang="pt" style="height: 100%;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico" />
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.9.1/font/bootstrap-icons.min.css">
    <link href="/static/css/my_styles.css" rel="stylesheet" />
    <!-- JS-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.1.3/socket.io.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script>
        var atendentesOriginalList = {{ atendetes | list | tojson  }};
        var atendentesUpdatedList = [];
        var menuOriginalList = {{ menu | tojson }};
        var menuUpdatedList = {};
        var vendas = {{ vendas | tojson }};
    </script>
    <script src="/static/js/admin-scripts.js" onload="loadAll()" defer></script>
    <script defer>
        document.addEventListener("DOMContentLoaded", function () {
            const socket = io();
            socket.on('update_admin', (data) => {
                vendas.push(data.data)
                historyLoad(data.data)
            });
        });
    </script>
</head>

<body class="full">
    <!-- Barra de Navegação -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fs-4">Serviço de Mesa</a>
            <button id="navbarToggle" class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                aria-label="Alterna navegação">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-item nav-link active" onclick="showSection(0)">Home</a>
                    <a class="nav-item nav-link" onclick="showSection(1)">Atendentes</a>
                    <a class="nav-item nav-link" onclick="showSection(2)">Menu</a>
                    <a class="nav-item nav-link" onclick="showSection(3)">Segurança</a>
                    <a class="nav-item nav-link" onclick="showSection(4)">Sobre</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Container com scroll interno nas seções -->
    <div class="content-container" id="contentContainer">
        {% include 'admin_html/home.html' %}
        {% include 'admin_html/users.html' %}
        {% include 'admin_html/menu.html' %}
        {% include 'admin_html/seguranca.html' %}
        {% include 'admin_html/sobre.html' %}
    </div>
</body>

</html>
